    - name: Packaged FX adjustment diagnostic integration (offline)
      if: runner.os == 'Linux'
      timeout-minutes: 8
      shell: bash
      run: |
        set -euo pipefail
        APP="$GITHUB_WORKSPACE/fincept-qt/dist/FinceptTerminal-Linux-x86_64.AppImage"
        test -s "$APP"
        scratch=$(mktemp -d "$RUNNER_TEMP/fincept-fx-package.XXXXXX")
        trap 'rm -rf -- "$scratch"' EXIT
        (
          cd "$scratch"
          timeout 60 "$APP" --appimage-extract 'usr/bin/scripts/*' > extract.log
        )
        staged="$scratch/squashfs-root/usr/bin/scripts"
        for name in yfinance_data.py fincept_json.py fx_adjustment_observer_v1.py fx_adjustment_origin_v1.py; do
          test -f "$staged/$name"
          cmp "$GITHUB_WORKSPACE/fincept-qt/scripts/$name" "$staged/$name"
          sha256sum "$staged/$name"
        done
        # AppImage extraction creates mode 0700 directories owned by the runner.
        # Allow traversal of the private, directly bind-mounted test directory only.
        chmod 0755 "$staged"
        # Public dependency downloads only during image build; tests have no network.
        docker build -t fincept-fx-adjustment-qa:ci - <<'DOCKERFILE'
        FROM python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
        RUN python3 -m pip --isolated install --disable-pip-version-check --no-cache-dir --only-binary=:all: --timeout 15 --retries 0 numpy==2.4.6 pandas==2.3.3 yfinance==0.2.66 curl_cffi==0.13.0
        USER 10001:10001
        WORKDIR /work/repo
        DOCKERFILE
        docker run --rm --network none --read-only --cap-drop ALL \
          --security-opt no-new-privileges --user 10001:10001 \
          --pids-limit 128 --memory 1g --cpus 1 --tmpfs /tmp:rw,nosuid,size=64m \
          --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work/repo,readonly" \
          --mount "type=bind,src=$staged,dst=/qa-scripts,readonly" \
          --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 \
          --env PYTHONPATH=/qa-scripts:/work/repo/scripts:/work/repo/scripts/yahoo_capture_service_v1 \
          fincept-fx-adjustment-qa:ci python3 -c 'import pathlib, unittest, yfinance_data, fincept_json, fx_adjustment_observer_v1, fx_adjustment_origin_v1; mods=(yfinance_data,fincept_json,fx_adjustment_observer_v1,fx_adjustment_origin_v1); assert all(pathlib.Path(m.__file__).parent==pathlib.Path("/qa-scripts") for m in mods); print("PACKAGED_MODULE_PATHS_PASS",flush=True); suite=unittest.defaultTestLoader.discover("tests/fincept_original",pattern="test_fx_adjustment_diagnostic_integration_v1.py"); r=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(0 if r.wasSuccessful() and r.testsRun==14 else 1)'
        echo "FINCEPT_PACKAGED_FX_ADJUSTMENT_QA_PASS"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ runner.os == 'macOS' && 'fincept-qt/dist.tar.gz' || 'fincept-qt/dist/' }}
        retention-days: 30
