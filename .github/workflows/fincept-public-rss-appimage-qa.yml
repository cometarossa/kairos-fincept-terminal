name: Fincept Linux original AppImage — bounded public RSS QA
on:
  pull_request:
    paths:
      - ".github/workflows/fincept-public-rss-appimage-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  packaged-public-rss:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox --disable-gpu-compositing"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Download exact original Fincept #77 GitHub-built AppImage
        uses: actions/download-artifact@v4
        with:
          name: FinceptTerminal-Linux-x64
          run-id: "45127883046"
          github-token: ${{ github.token }}
          path: dist
      - name: Verify SHA of exact original source artifact
        shell: bash
        run: |
          set -euo pipefail
          APP=dist/FinceptTerminal-Linux-x86_64.AppImage
          test -s "$APP"
          echo "9509ee141d86e72d9a73e92d9f4f7f88e31fa292f7393c1f6957b7c6f8b306f5  $APP" | sha256sum -c -
          chmod +x "$APP"
          echo "FINCEPT_ORIGINAL_SOURCE_HEAD=af4ea02d68184ce75f25bd4fd296804fdeab2115"
      - name: Install headless original Qt AppImage system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libopengl0 \
            libdbus-1-3 libnss3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Acquire one bounded no-redirect public finance RSS (no broker)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 8 --max-time 20 \
            --max-filesize 180000 --max-redirs 0 --retry 0 --proto '=https' \
            -H 'Accept: application/rss+xml, application/xml' \
            -A 'FinceptOriginalRSS-QA/1.0 (read-only; no-account)' \
            'https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114' \
            --output "$RUNNER_TEMP/public-finance.xml"
          python3 - <<'PY'
          import hashlib, os, xml.etree.ElementTree as ET
          from pathlib import Path
          blob = (Path(os.environ["RUNNER_TEMP"]) / "public-finance.xml").read_bytes()
          root = ET.fromstring(blob)
          items = root.findall("./channel/item")
          assert root.tag == "rss" and 1 <= len(items) <= 100
          assert all(i.findtext("pubDate") and i.findtext("link") for i in items)
          print("UNATTESTED_PUBLISHER_RSS_SHA256", hashlib.sha256(blob).hexdigest())
          print("PUBLIC_RSS_ITEM_COUNT", len(items))
          PY
      - name: Original packaged Qt FeedSelfTest — actual CNBC RSS must succeed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fincept-rss-home"
          export HOME="$RUNNER_TEMP/fincept-rss-home"
          export XDG_CONFIG_HOME="$HOME/config"
          export XDG_CACHE_HOME="$HOME/cache"
          export FINCEPT_QA_PUBLIC_RSS_FILE="$RUNNER_TEMP/public-finance.xml"
          timeout 110 dist/FinceptTerminal-Linux-x86_64.AppImage \
            --profile ci-original-public-news --selftest-feeds \
            >"$RUNNER_TEMP/original-public-news.log" 2>&1 || {
              tail -n 16 "$RUNNER_TEMP/original-public-news.log"
              exit 1
            }
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ["RUNNER_TEMP"]) / "original-public-news.log").read_text(errors="replace")
          match = re.search(
              r"\[NewsDateQA\] external_rss_items=(\d+) parsed_publisher_dates=(\d+) "
              r"recent_24h_https=(\d+) latest_publisher_epoch=(\d+)", log)
          assert match is not None, "Original Qt RSS QA marker absent"
          items, dates, recent, epoch = map(int, match.groups())
          assert 1 <= items <= 100 and 1 <= dates <= items and 1 <= recent <= dates
          assert epoch > 0 and "feed selftest: OK (0 failures)" in log
          assert "[PASS] news: saved real public RSS parsed and dated by ORIGINAL NewsService" in log
          print("FINCEPT_LINUX_APPIMAGE_ORIGINAL_RSS_PASS", items, dates, recent, epoch)
          print("MARKET_AS_OF_VERIFIED=false BROKER_CALLS=0")
          PY
      - name: Original packaged Qt FeedSelfTest — stale date must fail closed
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/stale-synthetic.xml" <<'RSS'
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"><channel>
          <item><title>Old test fixture, not financial news</title>
          <link>https://example.org/fixture</link>
          <pubDate>Wed, 04 Jun 2025 10:00:00 GMT</pubDate></item>
          </channel></rss>
          RSS
          export HOME="$RUNNER_TEMP/fincept-rss-home"
          export XDG_CONFIG_HOME="$HOME/config"
          export XDG_CACHE_HOME="$HOME/cache"
          export FINCEPT_QA_PUBLIC_RSS_FILE="$RUNNER_TEMP/stale-synthetic.xml"
          set +e
          timeout 110 dist/FinceptTerminal-Linux-x86_64.AppImage \
            --profile ci-original-stale-news --selftest-feeds \
            >"$RUNNER_TEMP/original-stale-news.log" 2>&1
          exit_code=$?
          set -e
          test "$exit_code" -eq 1 || {
            echo "::error::Expected original Qt stale RSS refusal exit 1; got $exit_code"
            exit 1
          }
          grep -q 'recent_24h_https=0' "$RUNNER_TEMP/original-stale-news.log"
          grep -Fq '[FAIL] news: saved real public RSS parsed and dated by ORIGINAL NewsService' "$RUNNER_TEMP/original-stale-news.log"
          echo "FINCEPT_LINUX_APPIMAGE_STALE_REFUSED expected_exit=1"
      - name: Report precise scope
        if: always()
        shell: bash
        run: |
          echo "SOURCE=Fincept #77 original Linux AppImage, exact pinned SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "QA=public publisher RSS local parse, no MCP/IG/broker actions" >> "$GITHUB_STEP_SUMMARY"
          echo "UNVERIFIED=independent Debian AppImage, authentic source clock, live Qt MCP to KAIROS" >> "$GITHUB_STEP_SUMMARY"
